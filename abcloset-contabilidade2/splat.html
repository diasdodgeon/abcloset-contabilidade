<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Fire-Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Painel de Conexão */
        #setup {
            padding: 20px;
            background: #151515;
            border-bottom: 2px solid #333;
        }
        .status-dot {
            height: 10px; width: 10px; background: #ff4444;
            border-radius: 50%; display: inline-block; margin-right: 5px;
        }
        .connected { background: #44ff44; box-shadow: 0 0 10px #44ff44; }

        input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: #000; border: 1px solid #444; color: #fff; border-radius: 8px;
        }

        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 15px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-teclado { background: #3a86ff; color: white; }
        .btn-monitor { background: #8338ec; color: white; }
        button:active { transform: scale(0.98); opacity: 0.8; }

        /* Área do Teclado (Mobile) */
        #keyboard-area {
            display: none; /* Só aparece se for modo teclado */
            flex: 1;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }
        .key {
            background: #222; border-bottom: 4px solid #000;
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; font-size: 24px; user-select: none;
        }
        .key:active { background: #333; border-bottom: 0; transform: translateY(4px); }

        /* Área do Monitor */
        #monitor-area {
            display: none;
            flex: 1; padding: 20px;
        }
        #output {
            width: 100%; height: 100%; background: #111;
            border: 1px solid #333; padding: 15px; font-family: monospace;
            font-size: 18px; color: #44ff44; border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="setup">
    <div><span id="dot" class="status-dot"></span> <span id="status">Desconectado</span></div>
    <input type="text" id="roomInput" placeholder="Digite o ID da Sala (ex: sala77)">
    <div class="btn-group">
        <button class="btn-teclado" id="btnSetTeclado">Modo Teclado</button>
        <button class="btn-monitor" id="btnSetMonitor">Modo Monitor</button>
    </div>
</div>

<div id="keyboard-area">
    <div class="key" data-val="7">7</div><div class="key" data-val="8">8</div><div class="key" data-val="9">9</div>
    <div class="key" data-val="4">4</div><div class="key" data-val="5">5</div><div class="key" data-val="6">6</div>
    <div class="key" data-val="1">1</div><div class="key" data-val="2">2</div><div class="key" data-val="3">3</div>
    <div class="key" data-val="Backspace" style="background:#442222">DEL</div>
    <div class="key" data-val="0">0</div>
    <div class="key" data-val="Enter" style="background:#224422">OK</div>
</div>

<div id="monitor-area">
    <textarea id="output" readonly placeholder="Aguardando entrada do teclado..."></textarea>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
// Procure por esta linha no seu código e garanta que 'doc' esteja nela
import { 
    initializeFirestore, 
    doc,           // <--- CERTIFIQUE-SE QUE ESTÁ AQUI
    setDoc, 
    updateDoc, 
    onSnapshot, 
    getDoc, 
    collection, 
    addDoc 
} from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    // --- CONFIGURAÇÃO FIREBASE (Substitua pelos seus dados) ---
    const firebaseConfig = {
  apiKey: "AIzaSyBWJ97Q-BbC8MX1JCTOxiY5c-DxnkUKKsc",
  authDomain: "minha-galeria-de-videos.firebaseapp.com",
  projectId: "minha-galeria-de-videos",
  storageBucket: "minha-galeria-de-videos.firebasestorage.app",
  messagingSenderId: "322400887452",
  appId: "1:322400887452:web:4797684e09620facb7c359"
};

    const app = initializeApp(firebaseConfig);
   // Substitua o getFirestore(app) por esta configuração:
const db = initializeFirestore(app, {
  experimentalForceLongPolling: true,
});
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    
    let pc = new RTCPeerConnection(rtcConfig);
    let dataChannel = null;

    const statusTxt = document.getElementById('status');
    const dot = document.getElementById('dot');

    // --- MODO TECLADO (OFERTA) ---
    document.getElementById('btnSetTeclado').onclick = async () => {
        const roomId = document.getElementById('roomInput').value;
        if (!roomId) return alert("Digite um ID para a sala");
        
        document.getElementById('setup').style.display = 'none';
        document.getElementById('keyboard-area').style.display = 'grid';
        statusTxt.innerText = "Criando sala: " + roomId;

        dataChannel = pc.createDataChannel("inputStream");
        setupDataChannel(dataChannel);

        // ICE Candidates
        const callerCandidates = collection(db, "rooms", roomId, "callerCandidates");
        pc.onicecandidate = e => e.candidate && addDoc(callerCandidates, e.candidate.toJSON());

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        
        await setDoc(doc(db, "rooms", roomId), { offer: { type: offer.type, sdp: offer.sdp } });

        // Ouvir resposta
        onSnapshot(doc(db, "rooms", roomId), async snap => {
            const data = snap.data();
            if (!pc.currentRemoteDescription && data?.answer) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        // Ouvir candidatos do monitor
        onSnapshot(collection(db, "rooms", roomId, "calleeCandidates"), snap => {
            snap.docChanges().forEach(change => {
                if (change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            });
        });
    };

    // --- MODO MONITOR (RESPOSTA) ---
document.getElementById('btnSetMonitor').onclick = async () => {
    const roomId = document.getElementById('roomInput').value;
    if (!roomId) return alert("Digite o ID da sala criada pelo teclado");

    const roomRef = doc(db, "rooms", roomId);
    const roomSnap = await getDoc(roomRef);

    // VERIFICAÇÃO CRÍTICA: Se a sala não existe ou não tem oferta
    if (!roomSnap.exists() || !roomSnap.data().offer) {
        alert("Sala não encontrada ou o Teclado ainda não gerou o sinal. Tente novamente em 2 segundos.");
        return;
    }

    document.getElementById('setup').style.display = 'none';
    document.getElementById('monitor-area').style.display = 'block';
    statusTxt.innerText = "Conectando à sala: " + roomId;

    pc.ondatachannel = e => setupDataChannel(e.channel);

    const calleeCandidates = collection(db, "rooms", roomId, "calleeCandidates");
    pc.onicecandidate = e => e.candidate && addDoc(calleeCandidates, e.candidate.toJSON());

    const offer = roomSnap.data().offer; // Agora é seguro ler
    await pc.setRemoteDescription(new RTCSessionDescription(offer));

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await updateDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } });

    onSnapshot(collection(db, "rooms", roomId, "callerCandidates"), snap => {
        snap.docChanges().forEach(change => {
            if (change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
    });
};

    function setupDataChannel(channel) {
        channel.onopen = () => {
            statusTxt.innerText = "CONECTADO";
            dot.classList.add('connected');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        };

        channel.onmessage = e => {
            const out = document.getElementById('output');
            if (e.data === "Backspace") out.value = out.value.slice(0, -1);
            else if (e.data === "Enter") out.value += "\n";
            else out.value += e.data;
        };

        // Enviar dados ao tocar nas teclas
        document.querySelectorAll('.key').forEach(key => {
            key.ontouchstart = (e) => {
                e.preventDefault();
                if (channel.readyState === "open") {
                    channel.send(key.dataset.val);
                    if (navigator.vibrate) navigator.vibrate(30);
                }
            };
        });
    }
</script>
</body>
</html>
