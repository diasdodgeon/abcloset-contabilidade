<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Controle P2P</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body {
            font-family: sans-serif;
            background: #0f0f0f;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Cabeçalho compacto para configuração */
        .setup-panel {
            padding: 10px;
            background: #1a1a1a;
            font-size: 12px;
            border-bottom: 1px solid #333;
        }
        
        .controls { display: flex; gap: 5px; margin-top: 5px; }
        input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; }
        button { background: #444; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 12px; }
        
        /* Área Principal (Teclado/Touchpad) */
        #inputArea {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 15px;
            background: radial-gradient(circle at center, #222 0%, #0f0f0f 100%);
        }

        .key {
            background: #2a2a2a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px #000;
            transition: all 0.05s;
            user-select: none;
        }

        .key:active {
            transform: translateY(3px);
            box-shadow: 0 1px #000;
            background: #3a3a3a;
        }

        .status { font-size: 10px; color: #888; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="setup-panel">
    <div id="statusLabel">Status: Desconectado</div>
    <div class="controls">
        <button id="btnCreate">Gerar ID</button>
        <input id="inputCode" placeholder="Colar código do outro">
        <button id="btnConnect">Conectar</button>
    </div>
    <div id="connectionCode" style="word-break: break-all; margin-top:5px; color: #4CAF50; cursor: pointer;"></div>
</div>

<div id="inputArea">
    <div class="key" data-key="A">A</div>
    <div class="key" data-key="B">B</div>
    <div class="key" data-key="C">C</div>
    <div class="key" data-key="D">D</div>
    <div class="key" data-key="Space" style="grid-column: span 4;">ESPAÇO</div>
    <div class="key" data-key="Clear" style="grid-column: span 2; background: #442222;">LIMPAR</div>
    <div class="key" data-key="Enter" style="grid-column: span 2; background: #224422;">ENTER</div>
</div>

<script>

    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getFirestore, collection, doc, addDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBWJ97Q-BbC8MX1JCTOxiY5c-DxnkUKKsc",
  authDomain: "minha-galeria-de-videos.firebaseapp.com",
  projectId: "minha-galeria-de-videos",
  storageBucket: "minha-galeria-de-videos.firebasestorage.app",
  messagingSenderId: "322400887452",
  appId: "1:322400887452:web:76ff619a2842e42fb7c359"
};


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // --- FUNÇÃO PARA O TECLADO (CRIADOR DA SALA) ---
    async function startKeyboard(roomId) {
        const pc = new RTCPeerConnection(rtcConfig);
        const dc = pc.createDataChannel("inputControl");
        const roomRef = doc(db, "rooms", roomId);

        // Salvar candidatos ICE locais no Firebase
        pc.onicecandidate = e => {
            if (e.candidate) addDoc(collection(roomRef, "callerCandidates"), e.candidate.toJSON());
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await updateDoc(roomRef, { offer: { type: offer.type, sdp: offer.sdp } });

        // Ouvir quando o Monitor responder
        onSnapshot(roomRef, async snapshot => {
            const data = snapshot.data();
            if (!pc.currentRemoteDescription && data?.answer) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        // Ouvir candidatos do Monitor
        onSnapshot(collection(roomRef, "calleeCandidates"), snapshot => {
            snapshot.docChanges().forEach(change => {
                if (change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            });
        });

        return dc; // Use este canal para enviar os dados das teclas
    }

    // --- FUNÇÃO PARA O MONITOR (QUEM ENTRA NA SALA) ---
    async function startMonitor(roomId) {
        const pc = new RTCPeerConnection(rtcConfig);
        const roomRef = doc(db, "rooms", roomId);

        pc.ondatachannel = e => {
            const dc = e.channel;
            dc.onmessage = msg => console.log("Tecla recebida:", msg.data);
        };

        pc.onicecandidate = e => {
            if (e.candidate) addDoc(collection(roomRef, "calleeCandidates"), e.candidate.toJSON());
        };

        const roomSnap = await getDoc(roomRef);
        const offer = roomSnap.data().offer;
        await pc.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await updateDoc(roomRef, { answer: { type: answer.type, sdp: answer.sdp } });

        onSnapshot(collection(roomRef, "callerCandidates"), snapshot => {
            snapshot.docChanges().forEach(change => {
                if (change.type === "added") pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
            });
        });
    }

    const statusLabel = document.getElementById('statusLabel');
    const connectionCode = document.getElementById('connectionCode');
    const inputCode = document.getElementById('inputCode');
    
    let pc;
    let dc;
    const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // Inicializa WebRTC
    function initPeer(isOffer) {
        pc = new RTCPeerConnection(config);

        if (isOffer) {
            dc = pc.createDataChannel("chat");
            setupDataChannel();
        } else {
            pc.ondatachannel = (e) => {
                dc = e.channel;
                setupDataChannel();
            };
        }

        pc.onicecandidate = (e) => {
            if (!e.candidate) {
                connectionCode.textContent = btoa(JSON.stringify(pc.localDescription));
                statusLabel.textContent = "Código pronto! Copie e envie.";
            }
        };
    }

    function setupDataChannel() {
        dc.onopen = () => {
            statusLabel.textContent = "CONECTADO!";
            document.querySelector('.setup-panel').style.background = "#1a331a";
        };
        dc.onmessage = (e) => {
            // Se for o monitor, ele processa a tecla aqui
            console.log("Recebido:", e.data);
            if(e.data === "Clear") {
                 // Lógica para limpar o campo no monitor
            }
        };
    }

    // Ações dos botões
    document.getElementById('btnCreate').onclick = async () => {
        initPeer(true);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
    };

    document.getElementById('btnConnect').onclick = async () => {
        const val = inputCode.value;
        if (!val) return;
        
        const desc = JSON.parse(atob(val));
        if (!pc) initPeer(false);

        await pc.setRemoteDescription(desc);
        
        if (desc.type === 'offer') {
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
        }
    };

    // Captura de toques nas "teclas"
    document.querySelectorAll('.key').forEach(el => {
        el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const key = el.getAttribute('data-key');
            if (dc && dc.readyState === 'open') {
                dc.send(key);
                // Feedback tátil se disponível
                if (navigator.vibrate) navigator.vibrate(20);
            }
        });
    });
</script>
</body>
</html>
