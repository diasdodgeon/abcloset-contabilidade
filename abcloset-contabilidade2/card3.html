<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Menu de Seleção 3D Profissional</title>

<style>
/* --- RESET E LAYOUT BASE --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent; /* Remove destaque azul no toque */
}

body {
    background-color: #000;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden; /* Previne scroll da página */
    position: relative;
}

/* --- PERSPECTIVA DO AMBIENTE --- */
.cena-principal {
    perspective: 2000px; /* Perspectiva global aumentada para mobile */
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    transform-style: preserve-3d;
    transform-style: preserve-3d;
    transform: rotateX(10deg) rotateY(0deg) rotateZ(0deg); /* Base estática */
    position: relative;
}

/* --- CARROSSEL SUPERIOR (Conteiner dos Cards) --- */
.carrossel {
    width: 220px;
    height: 220px;
    position: relative;
    user-select: none;
    transform-style: preserve-3d;

    z-index: 2;
    /* Transição suave apenas para quando o JS NÃO está arrastando */
    transition: transform 0.1s linear; 
}

/* --- ESTILIZAÇÃO DOS CARDS (Sua base com Efeito Vidro) --- */
.item {
    position: absolute;
    width: 100%;
    height: 350px;
    
    /* Efeito de vidro transparente original */
    border-top: 2px solid #c7c5c0;
    border-left: 2px solid #c7c5c0;
    box-shadow: 5px 5px 12px #00000035;
    background: rgba(255, 255, 255, 0.15); /* #FFFFFF25 mais legível */
    border-radius: 15px;
    overflow: hidden;
    backdrop-filter: blur(4px);
    
    /* Layout interno */
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 100px;
    user-select: none;
    
    /* Transições suaves para efeitos visuais */
    transition: transform 0.1s linear, border 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    
    /* Garante que o texto interno não capture o toque */
    pointer-events: none; 
}

/* --- ✨ EFEITO LUMINOSO (Classe .ativo gerenciada pelo JS) --- */
/* Removido :hover e :active, aplicando apenas na carta em evidência */
.item.ativo {
    border: 3px solid #FFFFFF;
    box-shadow: 0 0 10px #FFFFFF, 0 0 25px #FFFFFF, 0 0 40px #FFFFFF;
}

/* --- DISCO INFERIOR (Roleta) --- */
.disco {
    width: 800px;
    height: 800px;
    position: absolute;
    bottom: -150px; /* Posicionado abaixo do carrossel */
    
    /* Seu gradiente conic-gradient original */
    background: conic-gradient( 
        #8b2c20 0% 12.5%,
        #1a1a1a 12.5% 25%,
        #8b2c20 25% 37.5%,
        #1a1a1a 37.5% 50%,
        #8b2c20 50% 62.5%,
        #1a1a1a 62.5% 75%,
        #8b2c20 75% 87.5%,
        #1a1a1a 87.5% 100%
    );
    border-radius: 50%;
    
    /* Aplica o efeito de disco achatado */
    transform-style: preserve-3d;
    transform: rotateX(80deg) rotateY(0deg) rotateZ(0deg); /* Base estática */
    
    border: 30px solid #FFFFFF;
    box-shadow: 0 0 50px #FFFFFF;
    z-index: 1;
    
    /* Mesma transição do carrossel para sincronia */
    transition: transform 0.1s linear; 
}

/* Container de controle para a cena unificada */
.phone-view {
    width: 100%;
    max-width: 430px; /* Largura base de smartphone */
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    touch-action: none; /* Desabilita scroll nativo do browser */
}

</style>
</head>

<body>

<div class="phone-view">
    <div class="cena-principal">
        
        <div class="carrossel" id="carrossel">
            <div class="item"><span id="superticioso"></span></div>
            <div class="item"><span id="marrento"></span></div>
            <div class="item"><span id="moribundo"></span></div>
            <div class="item"><span id="caotico"></span></div>
            <div class="item"><span id="sonolento"></span></div>
            <div class="item"><span id="falso"></span></div>
        </div>
        
        <div class="disco" id="disco"></div>
        
    </div>
</div>

<script>
// --- CONFIGURAÇÃO DOS PERSONAGENS (Data) ---
const sequencias = {
    superticioso: ["😨","😱","😰","💀","😢","😥","😓"],
    marrento: ["😡","😠","🤬","😤","😠"],
    moribundo: ["🤒","🥵","🤧","😩","🤢","🤮","😵","😑","💀"],
    caotico: ["🤪","😀","😄","😁","🤡","🤣","😆"],
    sonolento: ["😴","🤤","🥱","😩","🤫","😔","😪"],
    falso: ["🤥","😎","😇","😈","🤓","🤠","🤩","🧐","😷","🥳","🤕"]
};

const carousel = document.getElementById("carrossel");
const disco = document.getElementById("disco");
const items = carousel.querySelectorAll('.item');

// Configurações do Carrossel 3D
const TOTAL_ITEMS = items.length; // 6
const THETA = 360 / TOTAL_ITEMS; // 60 graus por item
const RADIUS = 300; // translateZ original

// --- ESTADO DO MOVIMENTO (Pointer Events Unificados) ---
let isDragging = false;
let startX = 0;
let currentRotation = 0; // Rotação total acumulada
let activeIndex = 0; // Índice do card ativo (0 a 5)

// Inicialização: Posiciona as cartas em círculo matematicamente
function posicionalInicial() {
    items.forEach((item, i) => {
        const angle = i * THETA;
        item.style.transform = `rotateY(${angle}deg) translateZ(${RADIUS}px)`;
        // O JS agora controla as transformações individuais, removendo do CSS nth-child
    });
    updateCardGlow(0); // Acende o primeiro card
}

// Atualiza a Rotação Unificada (Carrossel Y | Disco Z)
function updateRotation(newRotation) {
    // Aplica rotação ao carrossel
    carousel.style.transform = `rotateY(${newRotation}deg)`;
    
    // Aplica a mesma rotação ao Disco Inferior (eixo Z para rodar plano)
    // Mantendo o achatamento rotateX(75deg)
    disco.style.transform = `rotateX(80deg) rotateZ(${-newRotation}deg)`;
}

// Gerencia a classe de brilho .ativo
function updateCardGlow(index) {
    items.forEach((item, i) => {
        if (i === index) {
            item.classList.add('ativo');
        } else {
            item.classList.remove('ativo');
        }
    });
}

// --- LÓGICA DE GESTOS UNIFICADA (Mouse + Toque) ---
function onPointerDown(e) {
    isDragging = true;
    startX = e.clientX || e.touches?.[0].clientX || 0;
    
    // Remove transições para resposta imediata do dedo
    carousel.style.transition = 'none';
    disco.style.transition = 'none';
}

function onPointerMove(e) {
    if (!isDragging) return;
    
    const currentX = e.clientX || e.touches?.[0].clientX || 0;
    const dx = currentX - startX;
    
    // Fator de sensibilidade do arraste (0.3 do seu código)
    currentRotation += dx * 0.3;
    
    updateRotation(currentRotation);
    
    startX = currentX; // Atualiza base para o próximo frame
}

function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;
    
    // Readiciona transições para o efeito de "snap" (encaixe)
    carousel.style.transition = 'transform 0.5s ease-out';
    disco.style.transition = 'transform 0.5s ease-out';
    
    // Lógica do SNAP (Giro um por vez):
    // Calcula para qual card o carrossel deve se alinhar automaticamente.
    // O JS rounding garante que ele sempre encaixe em um múltiplo de THETA (60deg).
    
    let targetRotation = Math.round(currentRotation / THETA) * THETA;
    currentRotation = targetRotation; // Atualiza estado
    
    updateRotation(currentRotation);
    
    // Calcula qual card está ativo baseado na rotação final
    calculateActiveCard();
}

function calculateActiveCard() {
    // A rotação total do carrossel dividido por theta nos dá o offset.
    // Usamos módulo para garantir que fique entre 0 e 5.
    let indexOffset = ((-currentRotation / THETA) % TOTAL_ITEMS);
    if (indexOffset < 0) indexOffset += TOTAL_ITEMS; // Corrige rotações negativas
    
    activeIndex = Math.round(indexOffset);
    updateCardGlow(activeIndex);
}

// --- MOTOR DE ANIMAÇÃO DOS EMOJIS (Seu código original corrigido) ---
function reproduzirSequencia(nomeSequencia) {
    let index = 0;
    const emojis = sequencias[nomeSequencia];
    if (!emojis) return;

    function reproduzirEmoji() {
        const spanElemento = document.getElementById(nomeSequencia);
        if (spanElemento) {
            index = (index + 1) % emojis.length;
            spanElemento.textContent = emojis[index];
        }
        setTimeout(reproduzirEmoji, 300);
    }
    reproduzirEmoji();
}

function iniciarAnimações() {
    reproduzirSequencia('superticioso');
    reproduzirSequencia('marrento');
    reproduzirSequencia('moribundo');
    reproduzirSequencia('sonolento');
    reproduzirSequencia('caotico');
    reproduzirSequencia('falso');
}

// --- INICIALIZAÇÃO DO SISTEMA ---
window.onload = () => {
    posicionalInicial();
    iniciarAnimações();
    
    // Configura os ouvintes unificados no container mobile
    const container = document.querySelector('.phone-view');
    container.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    container.addEventListener('pointerleave', onPointerUp); // Segurança
};

</script>

</body>
</html>
