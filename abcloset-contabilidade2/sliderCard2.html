<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Deck de Cartas Inteligente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            position: relative;
        }

        /* Simula a tela vertical do celular */
        .phone-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: #1a1a1a;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empurra tudo para a parte inferior automaticamente */
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* =========================================
           1. ZONA DO DECK SUPERIOR (Slots Vazios)
           ========================================= */
        .top-deck-container {
            width: 100%;
            padding: 10px 10px;
            justify-content: flex-end;
            background-color: #121212;
            border-top: 1px solid #333;
            border-bottom: 2px dashed #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;

            z-index: 5; /* Fica acima do slider */
        }

        .deck-title {
            color: #888;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slots-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .slot {
            width: calc((100% / 5) - 6px);
            aspect-ratio: 1 / 1.5;
            max-width: 70px;
            border: 2px dashed #444;
            border-radius: 8px;
            position: relative;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot.hover {
            background-color: rgba(0, 212, 255, 0.1);
            border-color: #00bcd4;
        }

        /* =========================================
           2. ZONA DO SLIDER INFERIOR
           ========================================= */
        .slider-zone {
            width: 100%;
            height: 280px; /* Altura fixa confortável para o slider */
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 20px;
            background-color: #121212;
            position: relative;
            
            z-index: 1;
        }

        main#carousel {
            width: 100%;
            height: 100%;
            bottom: -10px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            perspective: 800px;
            --position: 3; 
            touch-action: none;
            user-select: none;
        }

        .card {
            width: 140px;
            height: 210px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 32px;
            color: #121212;
            cursor: grab;
            touch-action: none;
            user-select: none;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.35s ease;
            pointer-events: auto;
        }

        /* Cores base */
        .card[data-card="1"] { background-color: #90f1ef; }
        .card[data-card="2"] { background-color: #ff70a6; }
        .card[data-card="3"] { background-color: #ff9770; }
        .card[data-card="4"] { background-color: #ffd670; }
        .card[data-card="5"] { background-color: #e9ff70; }
        .card[data-card="6"] { background-color: #90f1ef; }
        .card[data-card="7"] { background-color: #ff70a6; }
        .card[data-card="8"] { background-color: #ff9770; }
        .card[data-card="9"] { background-color: #ffd670; }
        .card[data-card="10"] { background-color: #e9ff70; }


        /* Aplicação do 3D Matemático */
        #carousel .card {
            --r: calc(var(--position) - var(--offset));
            --abs: max(calc(var(--r) * -1), var(--r));

            transform: rotateY(calc(-15deg * var(--r))) 
                       translateX(calc(-65px * var(--r))) 
                       scale(calc(1 - (var(--abs) * 0.15)))
                       translateZ(calc(-5px * var(--abs)));

            z-index: calc(10 - var(--abs)); 
            opacity: calc(1 - (var(--abs) * 0.3));
        }

        .card.dragging {
            cursor: grabbing;
            transition: none !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            z-index: 1000 !important;
            opacity: 1 !important;
        }

        .slot .card {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 6px;
            transform: none !important;
            opacity: 1 !important;
            z-index: 1 !important;
            box-shadow: none;
            font-size: 16px;
        }

:root {
  --azul-principal: #4A76F1;
  --azul-disco: #0d2b6f;
  --bg-app: #000;
}



/* Container Principal */
.janela-agendamento {
  position: relative;
  width: 100%; 
  height: 100%; 
  background: #2b2b2b;
  overflow: hidden;
  display: flex;
  
}





/* Área do Disco (Lado Direito) */
#giro {
  position: absolute;
  top: 10%;
  left: 2%;
  transform: translate(-50%, -50%);
  
  width: 80vw;
  height: 80vw;
  max-width: 420px;
  max-height: 420px;

  z-index: 5;
  display: flex;
  justify-content: flex-end;
  justify-content: center;
  align-items: center;
}

#giro:active { cursor: grabbing; }

.disco {
  width: 100%;
  height: 100%;
  background: conic-gradient( 
    
    #8b2c20 0% 5%,
    #1a1a1a 5% 10%,
    #8b2c20 10% 15%,
    #1a1a1a 15% 20%,
    #8b2c20 20% 25%,
    #1a1a1a 25% 30%,
    #8b2c20 30% 35%,
    #1a1a1a 35% 40%,
    #8b2c20 40% 45%,
    #1a1a1a 45% 50%,
    #8b2c20 50% 55%,
    #1a1a1a 55% 60%,
    #8b2c20 60% 65%,
    #1a1a1a 65% 70%,
    #8b2c20 70% 75%,
    #1a1a1a 75% 80%,
    #8b2c20 80% 85%,
    #1a1a1a 85% 90%,
    #8b2c20 90% 95%,
    #1a1a1a 95% 100%

    );
  border-radius: 50%;
  position: relative center;
  box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 10px 0 20px rgba(0,0,0,0.3);
}

.horario {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
  color: rgba(255,255,255,0.3);
  transition: color 0.3s, font-size 0.3s, text-shadow 0.3s;
  font-size: 24px;
  pointer-events: none;
}

.horario.ativo {
  color: #fff;
  font-size: 38px;
  font-weight: bold;
  text-shadow: 0 0 15px rgba(255,255,255,0.6);
}



#powerUpsAtivos {
  position: absolute;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  
  display: flex;
  gap: 10px;
  padding: 10px;

  z-index: 10;
}

.powerUp {
  width: 50px;
  height: 50px;
  background: #111;
  border-radius: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  position: relative;
}

.timer {
  position: absolute;
  bottom: -5px;
  left: 0;
  height: 4px;
  background: lime;
  border-radius: 2px;
}



    </style>
</head>
<body>

    <div class="phone-container">

        <div id="powerUpsAtivos"></div>
  
        <div id="giro" >
         <div class="disco" id="disco"></div>
        </div>
        
        <div class="top-deck-container">
            <div class="deck-title">Mão do Jogador</div>
            <div class="slots-wrapper">
                <div class="slot" data-slot-id="1"></div>
                <div class="slot" data-slot-id="2"></div>
                <div class="slot" data-slot-id="3"></div>
                <div class="slot" data-slot-id="4"></div>
                <div class="slot" data-slot-id="5"></div>
            </div>
        </div>

        <div class="slider-zone" id="slider-zone">
            <main id="carousel">
                <div class="card" data-card="1"></div>
                <div class="card" data-card="2"></div>
                <div class="card" data-card="3"></div>
                <div class="card" data-card="4"></div>
                <div class="card" data-card="5"></div>
                <div class="card" data-card="6"></div>
                <div class="card" data-card="7"></div>
                <div class="card" data-card="8"></div>
                <div class="card" data-card="9"></div>
                <div class="card" data-card="10"></div>
            </main>
        </div>

    </div>

    <script>
        const carousel = document.getElementById('carousel');
        const sliderZone = document.getElementById('slider-zone');
        const slots = document.querySelectorAll('.slot');
        const phoneContainer = document.querySelector('.phone-container');
        
        let currentSliderPos = 5; // Começa na carta central (3)
        let totalCards = 10;

        // Controle de Gestos Inteligentes
        let draggingCard = null;
        let startX, startY;
        let cardStartX, cardStartY;
        let originalParent = null;

        let gestureDetermined = false;
        let gestureType = ''; // 'slide' ou 'drag'

        updateSlider();

        function createCardEvents(card) {
            card.addEventListener('pointerdown', onPointerDown);
        }

        document.querySelectorAll('.card').forEach(createCardEvents);

        function onPointerDown(e) {
            e.stopPropagation();

            draggingCard = e.currentTarget;
            originalParent = draggingCard.parentElement;

            startX = e.clientX;
            startY = e.clientY;

            const rect = draggingCard.getBoundingClientRect();
            const containerRect = phoneContainer.getBoundingClientRect();

            cardStartX = rect.left - containerRect.left;
            cardStartY = rect.top - containerRect.top;

            gestureDetermined = false;
            gestureType = '';

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointercancel', onPointerUp);
        }

        function onPointerMove(e) {
            if (!draggingCard) return;

            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // FASE 1: Se o gesto ainda não foi decidido, analisamos a direção
            if (!gestureDetermined) {
                const moveThreshold = 10; // Sensibilidade do gatilho (pixels)

                if (Math.abs(dx) > moveThreshold || Math.abs(dy) > moveThreshold) {
                    gestureDetermined = true;

                    // Se moveu mais na horizontal -> Deslizar o slider
                    if (Math.abs(dx) > Math.abs(dy)) {
                        gestureType = 'slide';
                    } 
                    // Se moveu mais na vertical -> Arrastar a carta
                    else {
                        gestureType = 'drag';
                        
                        // Executa o "desencaixe" apenas se a carta estava no slider
                        if (!draggingCard.classList.contains('in-slot')) {
                            draggingCard.style.width = '140px';
                            draggingCard.style.height = '210px';
                        }
                        
                        draggingCard.classList.add('dragging');
                        phoneContainer.appendChild(draggingCard);
                        draggingCard.style.setProperty('--abs', 0);
                        draggingCard.classList.remove('in-slot');
                    }
                }
                return; // Aguarda o próximo tick para rodar a lógica escolhida
            }

            // FASE 2: Executa o gesto escolhido
            if (gestureType === 'drag') {
                draggingCard.style.left = (cardStartX + dx) + 'px';
                draggingCard.style.top = (cardStartY + dy) + 'px';
                checkSlotsHover(e.clientX, e.clientY);
            }
        }

        function onPointerUp(e) {
            if (!draggingCard) return;

            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            window.removeEventListener('pointercancel', onPointerUp);

            // Finaliza o gesto de deslizamento do Slider
            if (gestureType === 'slide') {
                const dx = e.clientX - startX;
                const swipeThreshold = 50; // Sensibilidade de empurrar o card

                if (Math.abs(dx) > swipeThreshold) {
                    if (dx > 0) {
                        currentSliderPos = Math.max(1, currentSliderPos - 1); // Deslizou pra direita -> Carta anterior
                    } else {
                        currentSliderPos = Math.min(totalCards, currentSliderPos + 1); // Deslizou pra esquerda -> Próxima carta
                    }
                    updateSlider();
                }
            } 
            // Finaliza o gesto de arrastar carta
            else if (gestureType === 'drag') {
                const dropSuccess = handleDrop(e.clientX, e.clientY);
                if (!dropSuccess) {
                    returnToOrigin();
                }
            } 
            // Foi apenas um clique simples (sem arrastar nada)
            else {
                if (originalParent === carousel) {
                    const cardId = parseInt(draggingCard.getAttribute('data-card'));
                    if (cardId !== currentSliderPos) {
                        currentSliderPos = cardId;
                        updateSlider();
                    }
                }
                resetCardStyling(draggingCard);
                if (originalParent) originalParent.appendChild(draggingCard);
            }

            draggingCard.classList.remove('dragging');
            draggingCard = null;
            gestureDetermined = false;
            gestureType = '';
            slots.forEach(s => s.classList.remove('hover'));
        }

        function resetCardStyling(card) {
            card.style.left = '';
            card.style.top = '';
            card.style.width = '';
            card.style.height = '';
        }

        // função de devolução de rascunho de origem (returnToOrigin):
        function returnToOrigin() {
            resetCardStyling(draggingCard);
            if (originalParent === carousel) {
                carousel.appendChild(draggingCard); // Volta pro final do slider
                updateSlider();
            } else {
                draggingCard.classList.add('in-slot');
                originalParent.appendChild(draggingCard);
            }
        }

        function insertCardInCarouselOrder(card) {
            const cardId = parseInt(card.getAttribute('data-card'));
            const currentCards = Array.from(carousel.querySelectorAll('.card'));
            
            if (currentCards.length === 0) {
                carousel.appendChild(card);
                return;
            }

            let inserted = false;
            for (let i = 0; i < currentCards.length; i++) {
                const currentId = parseInt(currentCards[i].getAttribute('data-card'));
                if (cardId < currentId) {
                    carousel.insertBefore(card, currentCards[i]);
                    inserted = true;
                    break;
                }
            }
            if (!inserted) carousel.appendChild(card);
        }

        function checkSlotsHover(mouseX, mouseY) {
            slots.forEach(slot => {
                const rect = slot.getBoundingClientRect();
                if (mouseX >= rect.left && mouseX <= rect.right && mouseY >= rect.top && mouseY <= rect.bottom) {
                    slot.classList.add('hover');
                } else {
                    slot.classList.remove('hover');
                }
            });
        }

        function handleDrop(mouseX, mouseY) {
            // Drop nos slots (superior)
            for (let slot of slots) {
                const rect = slot.getBoundingClientRect();
                if (mouseX >= rect.left && mouseX <= rect.right && mouseY >= rect.top && mouseY <= rect.bottom) {
                    if (slot.children.length === 0) {
                        resetCardStyling(draggingCard);
                        draggingCard.classList.add('in-slot');
                        slot.appendChild(draggingCard);

                        if (originalParent === carousel) {
                            updateSliderAfterRemove();
                        }
                        return true;
                    }
                }
            }

            // Drop no Slider (Inferior)
           const sliderRect = sliderZone.getBoundingClientRect();
            if (mouseX >= sliderRect.left && mouseX <= sliderRect.right && mouseY >= sliderRect.top && mouseY <= sliderRect.bottom) {
                if (originalParent !== carousel) {
                    resetCardStyling(draggingCard);
                    
                    carousel.appendChild(draggingCard); // Joga no final do carrossel fisicamente
                    
                    const remaining = carousel.querySelectorAll('.card');
                    currentSliderPos = remaining.length; // FAZ O SLIDER IR AUTOMATICAMENTE ATÉ A ÚLTIMA CARTA (A que você acabou de soltar)

                    updateSlider();
                    return true;
                }
            }

            return false;
        }

        function updateSlider() {
            carousel.style.setProperty('--position', currentSliderPos);
            const cards = carousel.querySelectorAll('.card');
            totalCards = cards.length; // Atualiza o total de cartas dinamicamente

            cards.forEach((card, index) => {
                const offset = index + 1; // O offset agora é a posição ATUAL da carta na fila
                card.style.setProperty('--offset', offset);
                
                const abs = Math.abs(currentSliderPos - offset);
                card.style.setProperty('--abs', abs);
            });
        }

        function updateSliderAfterRemove() {
            const remainingCards = carousel.querySelectorAll('.card');
            if (remainingCards.length > 0) {
                // Se a posição do slider ficou além do número de cartas restantes, reajusta para a última
                if (currentSliderPos > remainingCards.length) {
                    currentSliderPos = remainingCards.length;
                }
            } else {
                currentSliderPos = 1;
            }
            updateSlider(); // Recalcula os novos offsets dinamicamente!
        }
const horarios = ["2", "8", "4", "5", "3", "6", "7", "2", "4", "9", "2",
"2", "3", "4", "10", "3", "2", "4", "2", "3"
];

const disco = document.getElementById("disco");
const elementoGiro = document.getElementById('giro');
const slotsData = [];

// Configuração Circular
const inicio = 97; 
const fim = 442; 

horarios.forEach((hora, i) => {
  const el = document.createElement("div");
  el.className = "horario";
  el.innerText = hora;

  const anguloBase = inicio + (i / (horarios.length - 1)) * (fim - inicio);

  el.style.transform = `
    translate(-50%, -50%)
    rotate(${anguloBase}deg)
    translate(0, -160px)
    rotate(-90deg)
  `;
  
  disco.appendChild(el);
  slotsData.push({ element: el, angle: anguloBase });
});

let grauAtual = 0;
let velocidade = 0;
let isDragging = false;
let ultimoAnguloMouse = 0;
const atrito = 0.98; 

function getAngle(e) {
  const rect = elementoGiro.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
}

function atualizarDestaque() {
  slotsData.forEach(slot => {
    let anguloVisual = (slot.angle + grauAtual) % 360;
    if (anguloVisual < 0) anguloVisual += 360;

    // Alvo é 90 graus (bem ao lado do contador)
    if (Math.abs(anguloVisual - 90) < 10) {
      slot.element.classList.add('ativo');
    } else {
      slot.element.classList.remove('ativo');
    }
  });
}

function aplicarMagnetismo() {
  if (isDragging || Math.abs(velocidade) > 0.3) return;

  let menorDistancia = Infinity;

  slotsData.forEach(slot => {
    let anguloVisual = (slot.angle + grauAtual) % 360;
    if (anguloVisual < 0) anguloVisual += 360;
    
    let dist = 90 - anguloVisual;
    if (dist > 180) dist -= 360;
    if (dist < -180) dist += 360;

    if (Math.abs(dist) < Math.abs(menorDistancia)) {
      menorDistancia = dist;
    }
  });

  grauAtual += menorDistancia * 0.1;
  velocidade *= 0.85;
}

// Interação
elementoGiro.addEventListener('mousedown', (e) => {
  isDragging = true;
  velocidade = 0;
  ultimoAnguloMouse = getAngle(e);
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const anguloAtualMouse = getAngle(e);
  let delta = anguloAtualMouse - ultimoAnguloMouse;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;

  velocidade = delta;
  grauAtual += delta;
  ultimoAnguloMouse = anguloAtualMouse;
  
  elementoGiro.style.transform = `rotate(${grauAtual}deg)`;
  atualizarDestaque();
});

window.addEventListener('mouseup', () => isDragging = false);

// Loop de Física
function animar() {
  if (!isDragging && Math.abs(velocidade) > 0.01) {
    velocidade *= atrito;
    grauAtual += velocidade;
    elementoGiro.style.transform = `rotate(${grauAtual}deg)`;
    atualizarDestaque();
    aplicarMagnetismo();
  } else if (!isDragging) {
    aplicarMagnetismo();
    elementoGiro.style.transform = `rotate(${grauAtual}deg)`;
    atualizarDestaque();
  }
  requestAnimationFrame(animar);
}

function adicionarPowerUpAtivo(emoji, duracao) {
  const container = document.getElementById("powerUpsAtivos");

  const el = document.createElement("div");
  el.className = "powerUp";
  el.innerHTML = `${emoji}<div class="timer"></div>`;

  const timer = el.querySelector(".timer");

  container.appendChild(el);

  let tempo = duracao;

  const intervalo = setInterval(() => {
    tempo -= 100;
    timer.style.width = (tempo / duracao * 100) + "%";

    if (tempo <= 0) {
      clearInterval(intervalo);
      el.remove();
    }
  }, 100);
}

let cartaSelecionada = null;

function criarCarta(emoji) {
  const deck = document.getElementById("deck");

  const el = document.createElement("div");
  el.className = "carta";
  el.innerText = emoji;

  let dragging = false;

  el.addEventListener("mousedown", () => {
    dragging = true;
    cartaSelecionada = el;
  });

  window.addEventListener("mouseup", (e) => {
    if (!dragging) return;
    dragging = false;

    const roleta = document.getElementById("giro").getBoundingClientRect();

    if (
      e.clientX > roleta.left &&
      e.clientX < roleta.right &&
      e.clientY > roleta.top &&
      e.clientY < roleta.bottom
    ) {
      ativarPowerUp(el.innerText);
      el.remove();
    }
  });

  deck.appendChild(el);
}
function ativarPowerUp(tipo) {
  console.log("Ativado:", tipo);

  if (tipo === "🧊") {
    velocidade *= 0.4;
    adicionarPowerUpAtivo("🧊", 3000);
  }

  if (tipo === "🌪️") {
    velocidade *= 1.8;
    adicionarPowerUpAtivo("🌪️", 3000);
  }
}

window.onload = () => {
  animar();

};

    </script>
</body>
