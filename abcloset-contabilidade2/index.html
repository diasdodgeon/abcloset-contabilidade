<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrossel 3D</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1000px;
  overflow: hidden;
}

.disco {
  width: 708px;
  height: 708px;
  top:280px;
  background:conic-gradient( 
    
    #8b2c20 0% 12.5%,
    #1a1a1a 12.5% 25%,
    #8b2c20 25% 37.5%,
    #1a1a1a 37.5% 50%,
    #8b2c20 50% 62.5%,
    #1a1a1a 62.5% 75%,
    #8b2c20 75% 87.5%,
    #1a1a1a 87.5% 100%
    )
      ;
  border-radius: 50%;
  transform-style: preserve-3d;
  transition: transform 1s;
  perspective: 1000px;
  position: relative;
  border: 30px solid #FFFFFF;
  box-shadow: 0 0 50px #FFFFFF;
  z-index: 2;
}

.disco{
  /* Aplica o efeito de disco achatado */
    transform-style: preserve-3d;
    transform: rotateX(85deg) rotateY(0deg) rotateZ(0deg); /* Base estática */
}
.torre{
  background-color: #222222;

  box-shadow: inset 50px 0 50px -50px rgba(0, 0, 0, 1), 
  inset -50px 0 50px -50px rgba(0, 0, 0, 1);

  width: 800px;
  height: 640px;
  z-index: 1;
}

.carrossel {
  width: 220px;
  height: 220px;
  position: relative;
  user-select: none;
  top: 500px;
  transform-style: preserve-3d;
  /*animation: girar 20s linear infinite;*/
  z-index: 3;
}

.item {
  position: absolute;
  width: 100%;
  height: 180px;
  /*efeito de vidro trasparente*/
  border-top: 2px solid #c7c5c0;
  border-left: 2px solid #c7c5c0;
  box-shadow: 5px 5px 12px #00000035;
  background: #FFFFFF25;
  border-radius: 15px;
  overflow: hidden;
  backdrop-filter: blur(4px);
  transition: border 0.3s ease-in-out;
  /*---------------------------*/
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 100px;
  user-select: none;
}
.item:hover, .item:active {
  border: 2px solid #FFFFFF;
  box-shadow: 0 0 10px #FFFFFF, 0 0 20px #FFFFFF, 0 0 30px #FFFFFF;
}

/* Posicionamento em círculo */
.item:nth-child(1) { transform: rotateY(0deg) translateZ(300px); }
.item:nth-child(2) { transform: rotateY(60deg) translateZ(300px); }
.item:nth-child(3) { transform: rotateY(120deg) translateZ(300px); }
.item:nth-child(4) { transform: rotateY(180deg) translateZ(300px); }
.item:nth-child(5) { transform: rotateY(240deg) translateZ(300px); }
.item:nth-child(6) { transform: rotateY(300deg) translateZ(300px); }

.cylinder-wrap {
   /* Cria a sensação de profundidade 3D */
   perspective: 1200px;
  /* '50% 30%' faz parecer que você está olhando levemente de cima */
  perspective-origin: 50% 30%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 400px;

  
  overflow: hidden;
}

.cylinder {
  position: relative;
  width: 0; /* O ponto central do cilindro */
  transform-style: preserve-3d;
  /* O pulo do gato: inclina o cilindro em 15 ou 20 graus */
  transform: rotateX(-15deg);
  animation: spin 12s linear infinite; /* Faz o cilindro rodar */

}

.cylinder span {
  position: absolute;
  top: 50%;
  left: 50%;
  font-size: 2.5rem;
  z-index: 8;
  font-family: sans-serif;
  font-weight: bold;
  color: white;
  text-transform: uppercase;
  backface-visibility: hidden;
  white-space: nowrap;
  /* O transform será aplicado dinamicamente pelo JS */
}





/* Animação para rotacionar o cilindro no eixo Y */

@keyframes spin {
  from { transform: rotateX(-10deg) rotateY(0deg); }
  to { transform: rotateX(-10deg) rotateY(360deg); }
}


@keyframes girar {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(360deg); }
}

</style>
</head>

<body>
<div style="position: relative; 
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;">
<div class="carrossel" id="carrossel" >
  <div class="item"><text id="superticioso"></text> </div>
  <div class="item"><text id="marrento"></text>     </div>
  <div class="item"><text id="moribundo"></text>    </div>
  <div class="item"><text id="caotico"></text>      </div>
  <div class="item"><text id="sonolento"></text>    </div>
  <div class="item"><text id="falso"></text>        </div>
</div>
<div class="disco"></div>
<div class="torre">

<div class="cylinder-wrap" >
  <div class="cylinder" id="cylinder-text">
  Impetuoso,quase nunca obedece ordens. 
  </div>
    <div class="cylinder" id="cylinder-text2"
    style="height: 80px;">
  Impetuoso,quase nunca ordens. 
  </div>
</div>

</div>
<script>
// função que permite reproduzir diferentes sequências de emojis:
const sequencias = {
  moribundo: ["🤒","🥵","🤧","😩","🤢","🤮","😵","😑","💀"],

  marrento: ["😡","😠","🤬","😤","😠"],

  superticioso: ["😨","😱","😰","💀","😢","😥","😓"],

  caotico: ["🤪","😀","😄","😁","🤡","🤣","😆"],

  sonolento: ["😴","🤤","🥱","😩","🤫","😔","😪"],

  falso: ["🤥","😎","😇","😈","🤓","🤠","🤩","🧐","😷","🥳","🤕"]
};




function reproduzirSequencia(nomeSequencia) {
  let index = 0;
  const emojis = sequencias[nomeSequencia];

  if (!emojis) return;

  function reproduzirEmoji() {
    // CORREÇÃO: use 'const' para que o ID seja local desta função
    const idElemento = nomeSequencia.toString(); 
    const texto = document.getElementById(idElemento);
    
    if (texto) {
      index = (index + 1) % emojis.length;
      texto.textContent = emojis[index];
    }
    setTimeout(reproduzirEmoji, 300);
  }

  reproduzirEmoji();
}

function iniciar() {
  // Inicia todas as sequências de uma vez para dar vida ao menu
  reproduzirSequencia('superticioso');
  reproduzirSequencia('marrento');
  reproduzirSequencia('moribundo');
  reproduzirSequencia('sonolento');
  reproduzirSequencia('caotico');
  reproduzirSequencia('falso');
}

iniciar(); 


const disco = document.querySelector('.disco');
let angulo = 0;

function girar() {
  angulo += 0.43;
  disco.style.transform = `
  scaleY(-0.10)
  rotate(${angulo}deg)
  `;
  requestAnimationFrame(girar);
}

//girar();  


const carrossel = document.getElementById("carrossel");


let rotacao = 0;
let segurando = false;
let inicioX = 0;

document.addEventListener("mousedown", (e) => {
  segurando = true;
  inicioX = e.clientX;
  carrossel.style.animation = "none";
  disco.style.animation = "none";
});

document.addEventListener("mouseup", () => {
  segurando = false;
});

document.addEventListener("mousemove", (e) => {
  if (!segurando) return;

  let delta = e.clientX - inicioX;
  rotacao += delta * 0.3;

  carrossel.style.transform = `rotateY(${rotacao}deg)`;
  
  inicioX = e.clientX;
});

const textContainer = document.getElementById('cylinder-text');
const text = textContainer.textContent;
textContainer.innerHTML = ''; // Limpa o texto original

const radius = 369; // Raio do cilindro em pixels (aumente se tiver muito texto)
const angleStep = 180 / text.length; // Divide os 360 graus pelo número de letras

text.split('').forEach((char, i) => {
  const span = document.createElement('span');
  span.textContent = char;
  
  // O pulo do gato: centraliza, rotaciona e afasta do centro (Z)
  span.style.transform = `
    translate(-50%, -50%) 
    rotateY(${i * angleStep}deg) 
    translateZ(${radius}px)
    rotateX(5deg)
  `;//rotateX(5deg)compensa a inclinaçao das letras
  
  textContainer.appendChild(span);
});
const textContainer2 = document.getElementById('cylinder-text2');
const text2 = textContainer2.textContent;
textContainer2.innerHTML = ''; // Limpa o texto original
text2.split('').forEach((char, i) => {
  const span = document.createElement('span');
  span.textContent = char;
  
  // O pulo do gato: centraliza, rotaciona e afasta do centro (Z)
  span.style.transform = `
    translate(-50%, -50%) 
    rotateY(${i * angleStep}deg) 
    translateZ(${radius}px)
    rotateX(5deg)
  `;//rotateX(5deg)compensa a inclinaçao das letras
  
  textContainer2.appendChild(span);
});
</script>

</body>
</html>
