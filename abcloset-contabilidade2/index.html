
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento</title>
<style>


.disco {
  width: 350px;
  height: 350px;
  background: #0d2b6f;
  border-radius: 50%;
  position: relative;
}

.horario {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-origin: center;
  color: grey;
  transition: color 0.2s, font-size 0.2s;
  font-size: 22px;
  transform: translate(-50%, -50%);
}

.horario.ativo {
  color: white;
  font-size: 28px;
  font-weight: bold;

}
#giro {
  width: 350px;
  height: 350px;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
}

:root {
  --azul-principal: #4A76F1;
  --azul-disco: #0d2b6f;
}



.interface-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none; /* Permite clicar no disco através do SVG */

}

/* Reposicionando o disco para alinhar com o eixo do SVG */
#giro {
  position: absolute;

  left: 31.5%; /* Alinha com o centro do círculo no SVG */
  top: 5%;
  transform: translate(-50%, -50%);
  width: 410px;
  height: 410px;
  z-index: 5;
}

.disco {
  width: 100%;
  height: 100%;
  background: var(--azul-disco); [cite: 9]
  border-radius: 50%;
  position: relative;
  box-shadow: 0 4px 15px rgba(0,0,0,0.9);
}


/* Classes para facilitar a troca de cor via JS futuramente */
.cor-painel { fill: var(--azul-principal); }
.cor-eixo { fill: var(--azul-principal); }

.janela-agendamento {
  position: relative;
  width: 800px; /* Largura da sua janela */
  height: 450px;
  background: white;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.9);
  animation: surgimento 1s ease-out;
}

@keyframes surgimento {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.btn-agendar-bg { fill: #0000cd; rx: 15; }
.btn-agendar-texto { font-size: 60px; font-weight: bold; fill: #fff; }

</style>
</head>
<body>

<div class="janela-agendamento">



  <div id="giro">
    <div class="disco" id="disco"></div>
  </div>
  
  
  <svg class="interface-svg" viewBox="0 0 1000 562" preserveAspectRatio="xMidYMid slice">
    <defs>

       <pattern id="pattern-wp" patternUnits="userSpaceOnUse" width="550" height="562">
        <!-- Substitua o href pela URL da sua imagem -->
        <!--https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop-->
        <image id="wp-image" href="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop" 
               x="0" y="0" width="550" height="562" preserveAspectRatio="xMidYMid slice" opacity="0.8" />
      </pattern>

        <filter id="sombra" x="-20%" y="-20%" width="150%" height="150%">
        <feDropShadow dx="5" dy="0" stdDeviation="5" flood-opacity="0.3"/>
      </filter>
    </defs>

    
    <rect class="cor-painel" x="0" y="0" width="550" height="562" fill="var(--azul-principal)" />
    <rect x="0" y="0" width="550" height="562" fill="url(#pattern-wp)" />


    
    <rect x="550" y="0" width="10" height="562" fill="rgba(0,0,0,0.2)" />

    <text x="210" y="310" font-family="Arial" font-size="70" fill="white">Vagas:</text>

    <circle class="cor-eixo" cx="555" cy="281" r="105" fill="#4A76F1" filter="url(#sombra)" />
    

    <!-- Textos Informativos -->
    <!--
    <text x="40" y="50" class="label-topo">dia:</text>
    <text x="40" y="125" class="valor-topo">22 Quarta</text>
    
    <text x="40" y="210" class="label-topo">funcionamento:</text>
    <text x="40" y="285" class="valor-topo">07:00 as 17:00</text>-->


    <text id="vagas-num" x="555" y="310" text-anchor="middle" font-family="Arial" font-size="90" font-weight="bold" fill="white">00</text>

    <!-- Botão Agendar -->
    <g transform="translate(40, 480)">
      <rect width="320" height="100" class="btn-agendar-bg" />
      <text x="160" y="70" text-anchor="middle" class="btn-agendar-texto">AGENDAR</text>
    </g>

  </svg>
</div>

<div class="items"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
  
const somPremio = new Audio('premio.mp3');
let jaGanhouNesteGiro = false; // Impede que o som e confetes disparem repetidamente
let modoRoletaAtivo = false;  // Variável para saber se estamos no modo agendamento ou prêmios
// Novos dados para o modo Roleta

const premios = [ 
"5% OFF", "BRINDE", "10% OFF", "SORTE💎", "VALE-VIP","15% OFF",
 "+UMA VEZ","20% OFF"];

const temaCasino = {
  principal: "#D4AF37", // Dourado
  disco: "#1a1a1a",     // Preto Carvão
  wallpaper: "https://images.unsplash.com/photo-1596838132731-3301c3fd4317?q=80&w=1000", // Imagem de Casino
  botao: "#B22222"      // Vermelho Casino
};

const horarios = [ //horario de atendimento padrao de 8 horas
  "07:00", "08:00",  "09:00", "10:00",
  "13:00", "14:00", "15:00", "16:00"
];



const disco = document.getElementById("disco");
const elementoGiro = document.getElementById('giro');

// Armazenaremos os elementos e seus ângulos iniciais para facilitar a checagem
const slotsData = [];
//primeiro horario 7:00 sempre em 90graus
const inicio = 90;
//para cada novo horario alem dos 8 padrao, adcionamos +4 á "fim"
const fim = 405;

horarios.forEach((hora, i) => {
  const el = document.createElement("div");
  el.className = "horario";
  el.innerText = hora;

  const anguloBase = inicio + (i / (horarios.length - 1)) * (fim - inicio);

  el.style.transform = `
    translate(-50%, -50%)
    rotate(${anguloBase}deg)
    translate(0, -125px)
    rotate(-90deg)
  `;
  
  disco.appendChild(el);
  
  // Guardamos a referência do elemento e seu ângulo relativo
  slotsData.push({ element: el, angle: anguloBase });
});

let grauAtual = 0;
let velocidade = 0;
let isDragging = false;
let ultimoAnguloMouse = 0;
const atrito = 0.99; 

// Inicializa o som (certifique-se que o arquivo tic.mp3 esteja na mesma pasta)
const somTic = new Audio('tic.mp3');
let ultimoSlotTocado = -1;

function getAngle(e) {
  const rect = elementoGiro.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
}

// 1. Função de Destaque (Inmediato ao passar por 90°)
function atualizarDestaque() {
  let slotNoCentroAgora = -1;
  slotsData.forEach((slot, i) => {
    // Calculamos a posição visual real: ângulo do slot + rotação do disco
    // O alvo é o ângulo 90 (direita, onde está o contador)
    let anguloVisual = (slot.angle + grauAtual) % 360;
    if (anguloVisual < 0) anguloVisual += 360;

    // Se estiver muito próximo de 90 graus (margem de erro de 15 graus para visual)
    if (Math.abs(anguloVisual - 90) < 15) {
      slot.element.classList.add('ativo');
      slotNoCentroAgora = i; // Identifica qual slot está "ativo" no momento
    } else {
      slot.element.classList.remove('ativo');
    }
  });
  // GATILHO DO SOM: Se o slot no centro mudou, tocamos o tic
  if (slotNoCentroAgora !== -1 && slotNoCentroAgora !== ultimoSlotTocado) {
    somTic.currentTime = 0; // Reinicia o áudio para permitir tics rápidos
    somTic.play().catch(() => {
      // O navegador pode bloquear áudio sem interação prévia; 
      // como o usuário arrasta o disco, isso raramente será um problema. 
    });
    ultimoSlotTocado = slotNoCentroAgora;
  }

}

// 2. Lógica de Snap (O "freio" magnético)
function aplicarMagnetismo() {
  if (isDragging || Math.abs(velocidade) > 0.2) return;

  // Encontramos o slot mais próximo do ângulo 90
  let maisProximo = null;
  let menorDistancia = Infinity;

  slotsData.forEach(slot => {
    let anguloVisual = (slot.angle + grauAtual) % 360;
    if (anguloVisual < 0) anguloVisual += 360;
    
    let dist = 90 - anguloVisual;
    // Ajuste para a volta do círculo
    if (dist > 180) dist -= 360;
    if (dist < -180) dist += 360;

    if (Math.abs(dist) < Math.abs(menorDistancia)) {
      menorDistancia = dist;
      maisProximo = slot;
    }
  });

  // Se estiver devagar o suficiente, puxa o disco para o centro do slot
  if (maisProximo) {
    grauAtual += menorDistancia * 0.1; // Suavidade da atração
    velocidade *= 0.8; // Aumenta o freio
  }
}

elementoGiro.addEventListener('mousedown', (e) => {
  isDragging = true;
  velocidade = 0;
  ultimoAnguloMouse = getAngle(e);
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const anguloAtualMouse = getAngle(e);
  let delta = anguloAtualMouse - ultimoAnguloMouse;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;

  velocidade = delta;// A velocidade é baseada no movimento do mouse
  grauAtual += delta;
  ultimoAnguloMouse = anguloAtualMouse;
  
  elementoGiro.style.transform = `rotate(${grauAtual}deg)`;
  atualizarDestaque();
});

window.addEventListener('mouseup', () => isDragging = false);

//dispara os confetes
function celebrarVitoria() {
  if (jaGanhouNesteGiro) return;

  // 1. Tocar o som de vitória
  somPremio.currentTime = 0;
  somPremio.play();

  // 2. Disparar Confetes
  const duracao = 3 * 1000;
  const fimAnimacao = Date.now() + duracao;

  (function frame() {
    confetti({
      particleCount: 3,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      colors: ['#D4AF37', '#ffffff', '#ff0000'] // Cores de cassino: Dourado, Branco, Vermelho
    });
    confetti({
      particleCount: 3,
      angle: 120,
      spread: 55,
      origin: { x: 1 },
      colors: ['#D4AF37', '#ffffff', '#ff0000']
    });

    if (Date.now() < fimAnimacao) {
      requestAnimationFrame(frame);
    }
  }());

  jaGanhouNesteGiro = true;
}


// Loop de Animação (Física de Inércia)
function animar() {
  if (!isDragging && Math.abs(velocidade) > 0.05) {
    velocidade *= atrito;// Aplica o atrito progressivamente
    grauAtual += velocidade;
    elementoGiro.style.transform = `rotate(${grauAtual}deg)`;
    
    atualizarDestaque();
    aplicarMagnetismo();

    // Resetamos a trava enquanto a roleta ainda tem velocidade considerável
    if (Math.abs(velocidade) > 2) jaGanhouNesteGiro = false;

  } else if (!isDragging) {
    // Garante que o snap continue funcionando mesmo com velocidade quase zero
    aplicarMagnetismo();
    elementoGiro.style.transform = `rotate(${grauAtual}deg)`;
    atualizarDestaque();
    // CONDIÇÃO DE VITÓRIA:
    // Se a roleta parou (velocidade quase zero) e estamos no modo prêmios
    if (Math.abs(velocidade) <= 0.01 && modoRoletaAtivo && !jaGanhouNesteGiro) {
      celebrarVitoria();
    }
  }
  
  requestAnimationFrame(animar);
}

// Função para iniciar a animação de entrada
function iniciarAnimacaoEntrada() {
  // 1. Animação do Contador (00 a 10)
  const elementoVagas = document.getElementById('vagas-num');
  let valorFinal = 10;
  let valorAtual = 0;
  
  const intervaloContador = setInterval(() => {
    valorAtual++;
    // padStart garante que sempre mostre dois dígitos (01, 02...)
    elementoVagas.textContent = valorAtual.toString().padStart(2, '0');
    
    if (valorAtual >= valorFinal) {
      clearInterval(intervaloContador);
    }
  }, 100); // Ajuste a velocidade do contador aqui (ms)

  // 2. Animação do Disco (Giro de entrada)
  // Começamos o disco em uma rotação negativa (ex: duas voltas atrás)
  grauAtual = -475; 
  // Damos um "impulso" inicial para ele começar a girar
  velocidade = 5; 
}



// Função para o usuário trocar o wallpaper
function trocarWallpaper(url) {
  document.getElementById('wp-image').setAttribute('href', url);
}


function transformarParaRoleta() {
  // 1. Atualizar Cores (CSS Variables) [cite: 8, 11]
  const root = document.documentElement;
  root.style.setProperty('--azul-principal', temaCasino.principal);
  root.style.setProperty('--azul-disco', temaCasino.disco);
  
  // 2. Trocar Wallpaper [cite: 22]
  trocarWallpaper(temaCasino.wallpaper);
  
  // 3. Alterar Textos do SVG (Labels) [cite: 21]
  // Precisamos de adicionar IDs aos textos no seu SVG para facilitar
  // Exemplo: document.querySelector('.label-vagas').textContent = "Prémio:";
  
  // 4. Limpar e Reinjetar Dados no Disco [cite: 25]
  const disco = document.getElementById("disco");
  disco.innerHTML = ""; // Remove horários antigos
  slotsData.length = 0; // Limpa o array de referência [cite: 23]
  
  premios.forEach((premio, i) => {
    const el = document.createElement("div");
    el.className = "horario"; // Mantemos a classe para herdar o estilo de rotação
    el.innerText = premio;


    //primeiro horario 7:00 sempre em 90graus
    const inicio = 90;
    //para cada novo horario alem dos 8 padrao, adcionamos +4 á "fim"
    const fim = 405;
    const anguloBase = 90 + (i / (premios.length - 1)) * (fim -inicio);
     //[cite: 25]

    el.style.transform = `
      translate(-50%, -50%)
      rotate(${anguloBase}deg)
      translate(0, -160px)
      rotate(-90deg)
    `;
    
    disco.appendChild(el);
    slotsData.push({ element: el, angle: anguloBase }); //[cite: 26]
  });

  // 5. Transformar o Botão [cite: 21]
  const btnTexto = document.querySelector('.btn-agendar-texto');
  btnTexto.textContent = "GIRAR SORTE";
  
  // 6. Resetar Posição para efeito dramático
  grauAtual = 0; //[cite: 26]
  atualizarDestaque(); //[cite: 31]
}

function girarRoletaDePremios() {
  // Gera uma força de giro aleatória (entre 30 e 60)
  velocidade = 30 + Math.random() * 30; //[cite: 40]
  
  // Desativar interações manuais durante o giro (opcional)
  isDragging = false; //[cite: 26]
}

function ativarModoPremios() {
  modoRoletaAtivo = true;
  jaGanhouNesteGiro = true; // Começa travado para não disparar na troca
  
  // Aqui você chamaria a função transformarParaRoleta() que criamos antes
  // que troca os horários pelos itens: ["5% OFF", "BRINDE", etc...]
  transformarParaRoleta();
}

// Chame a animação logo após as definições
window.onload = () => {
iniciarAnimacaoEntrada();
animar();
};
ativarModoPremios();

</script>

</body>
</html>
