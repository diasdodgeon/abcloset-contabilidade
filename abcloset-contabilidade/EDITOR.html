#preview-img {
    position: absolute;
    /* Remover estas linhas se existirem: width: 100%; height: 100%; object-fit: cover; */
    
    /* Forçar a imagem a ignorar o tamanho do container pai */
    width: auto !important;
    height: auto !important;
    max-width: none !important;
    max-height: none !important;

    /* Garantir que ela comece cobrindo pelo menos a área visível */
    min-width: 100%;
    min-height: 100%;

    cursor: move;
    transform-origin: center; /* O zoom acontecerá a partir do centro */

}

}

/* Item do Menu (O Retângulo) */

.frame-layer {

/* O "Puck" (botão de arrastar) do slider */

<script type="text/javascript">

document.addEventListener("DOMContentLoaded", () => {
    const img = document.getElementById('preview-img');
    const video = document.getElementById('camera-stream');
    const initialControls = document.getElementById('initial-controls');
    const editControls = document.getElementById('edit-controls');
    const cameraControls = document.getElementById('camera-controls');
    const inputFile = document.getElementById('input-file');
    const container = document.getElementById('banner-fachada-container');
    const tutorial = document.getElementById('tutorial-anim');
    ;
    const defaultImage = "banner.jpg";
    let stream = null;

    // 1. Função para disparar o tutorial
    function startTutorial() {
        tutorial.style.display = 'block';
        tutorial.play();
    }

    // 2. Função para parar o tutorial
    function stopTutorial() {
        if (tutorial.style.display === 'block') {
            tutorial.pause();
            tutorial.style.display = 'none';
        }
    }
    // 1. CARREGAR AO INICIAR
    // Tenta recuperar a imagem salva e o enquadramento
    const savedFachada = localStorage.getItem('fachada_image');
    const savedTransform = localStorage.getItem('fachada_transform');

    if (savedFachada) {
        img.src = savedFachada;
        if (savedTransform) {
            // Aplica o enquadramento salvo (x, y, scale)
            img.style.transform = savedTransform;
            // Atualiza o objeto 'state' interno para o JS não se perder
            const match = savedTransform.match(/translate3d\((.+)px, (.+)px, .+\) scale\((.+)\)/);
            if (match) {
                state.x = parseFloat(match[1]);
                state.y = parseFloat(match[2]);
                state.scale = parseFloat(match[3]);
            }
        }
    } else {
        img.src = defaultImage;
    }



   
     

    // --- RESET E INTERFACE ---
    function showInitialUI() {
        initialControls.style.display = 'flex';
        editControls.style.display = 'none';
        cameraControls.style.display = 'none';
        video.style.display = 'none';
        
        // Reset de estilo e posição
        //img.style.transform = `translate(0,0) scale(1)`;
        img.style.opacity = "1";
    }

    // --- LOGICA DE GALERIA ---
    document.getElementById('btn-gallery').onclick = () => inputFile.click();

    // 1. CORREÇÃO DA GALERIA (No evento onchange do input-file)
    inputFile.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            img.src = event.target.result;
            
            // O segredo está aqui: esperar carregar e resetar o Transformer
            img.onload = () => {
                resetImageToFreeMode();
                initialControls.style.display = 'none';
                editControls.style.display = 'flex';
                img.style.opacity = "0.8";
                // Se estivermos entrando no modo de edição, mostre a mãozinha
                if (editControls.style.display === 'flex') {
                    startTutorial();
                } 
            };
            // Quando o usuário tocar no container para começar a mover
            container.addEventListener('touchstart', () => {
                stopTutorial(); // A mãozinha some no exato momento do toque
            }, { passive: true });

        };
        reader.readAsDataURL(file);
    }
};
    
    function setupZoom() {
    const zoomInput = document.getElementById('camera-zoom');
    const capabilities = videoTrack.getCapabilities();

    // Verifica se a câmera suporta zoom
    if (capabilities.zoom) {
        zoomInput.min = capabilities.zoom.min;
        zoomInput.max = capabilities.zoom.max;
        zoomInput.step = capabilities.zoom.step;
        zoomInput.value = capabilities.zoom.min;

        zoomInput.oninput = async () => {
            try {
                await videoTrack.applyConstraints({
                    advanced: [{ zoom: zoomInput.value }]
                });
            } catch (e) {
                console.warn("Falha ao aplicar zoom:", e);
            }
        };
        zoomInput.parentElement.style.display = 'flex';
    } else {
        // Esconde a barra se a câmera não tiver suporte
        zoomInput.parentElement.style.display = 'none';
    }
}

    // --- LOGICA DE CÂMERA ---
    document.getElementById('btn-camera').onclick = async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;

            // Captura a trilha de vídeo para controlar o zoom
            videoTrack = stream.getVideoTracks()[0];


            video.style.display = 'block';
            initialControls.style.display = 'none';
            cameraControls.style.display = 'block';

            // Configura o Slider de Zoom se o hardware permitir
            setupZoom();

        } catch (err) {
            alert("Erro ao acessar câmera.");
        }
    };

    // 2. CORREÇÃO DA CÂMERA (No evento de captura)
    // Quando capturar da Câmera
    document.getElementById('btn-capture').onclick = () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        img.src = canvas.toDataURL('image/jpeg');
        
        img.onload = () => {
            stopCamera();
            resetImageToFreeMode(); // Aplica o modo livre na foto da câmera
            cameraControls.style.display = 'none';
            editControls.style.display = 'flex';
        };
    };

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }
        video.style.display = 'none';
    }

    document.getElementById('btn-close-camera').onclick = () => {
        stopCamera();
        showInitialUI();
    };

    // --- CANCELAR E CONFIRMAR ---
// 3. LOGICA DE CANCELAMENTO (RESTAURAR ÚLTIMA SALVA)
    document.getElementById('btn-cancel-edit').onclick = () => {
        const lastSaved = localStorage.getItem('fachada_image');
        const lastTransform = localStorage.getItem('fachada_transform');

        if (lastSaved) {
            img.src = lastSaved;
            img.onload = () => {
                if (lastTransform) {
                    img.style.transform = lastTransform;
                    // Sincroniza o estado interno
                    const match = lastTransform.match(/translate3d\((.+)px, (.+)px, .+\) scale\((.+)\)/);
                    if (match) {
                        state.x = parseFloat(match[1]);
                        state.y = parseFloat(match[2]);
                        state.scale = parseFloat(match[3]);
                    }
                } else {
                    resetImagePosition();
                }
            };
        } else {
            // Se nunca salvou nada, volta para a padrão de fábrica
            img.src = defaultImage;
            img.onload = resetImagePosition;
        }

        stopTutorial(); // Garante que a mãozinha suma
        showInitialUI();
    };

    // 2. LOGICA DE CONFIRMAÇÃO (SALVAR)
    document.getElementById('btn-confirm-edit').onclick = () => {
        // Salva a imagem atual (em Base64 se for da galeria/camera)
        localStorage.setItem('fachada_image', img.src);
        
        // Salva o enquadramento exato
        const currentTransform = img.style.transform;
        localStorage.setItem('fachada_transform', currentTransform);

        alert("Nova fachada salva com sucesso!");
        
        // Finaliza o modo de edição
        img.style.opacity = "1";
        showInitialUI();
    };

    // [O código de movimentação/zoom com TouchEvents deve ser mantido aqui]
    function updateTransform() {
    img.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
}
// Função para resetar posição e escala (importante para não começar cortada)
// Esta função será o seu "Setador de Atributos" toda vez que a imagem mudar
function resetImageToFreeMode() {
    state.x = 0;
    state.y = 0;
    state.scale = 1;

    
    // Removemos qualquer trava de largura/altura que possa ter sido injetada
    img.style.width = 'auto';
    img.style.height = 'auto';
    
    updateTransform();
}





    let state = {
    x: 0, y: 0, scale: 1,
    isDragging: false,
    lastX: 0, lastY: 0,
    lastDist: 0 // Para o pinch-zoom (dois dedos)
};
// --- LÓGICA DE MANIPULAÇÃO ---
container.addEventListener('touchstart', (e) => {
    if (editControls.style.display === 'none') return;
    
    state.isDragging = true;
    if (e.touches.length === 1) {
        state.lastX = e.touches[0].clientX - state.x;
        state.lastY = e.touches[0].clientY - state.y;
    } else if (e.touches.length === 2) {
        state.lastDist = getDistance(e.touches);
    }
});

container.addEventListener('touchmove', (e) => {
    if (!state.isDragging) return;

    if (e.touches.length === 1) {
        state.x = e.touches[0].clientX - state.lastX;
        state.y = e.touches[0].clientY - state.lastY;
    } else if (e.touches.length === 2) {
        const dist = getDistance(e.touches);
        const delta = dist / state.lastDist;
        state.scale *= delta;
        state.lastDist = dist;
    }
    updateTransform();
});


document.addEventListener("DOMContentLoaded", () => {
    const menu = document.getElementById('molduras-menu');
    const itens = document.querySelectorAll('.moldura-item');

    itens.forEach(item => {
        item.addEventListener('click', () => {
            // 1. Remove a classe ativa de todos
            itens.forEach(i => i.classList.remove('active'));
            
            // 2. Adiciona no item clicado
            item.classList.add('active');

            // 3. Pega o caminho da moldura
            const frameSrc = item.getAttribute('data-src');

            // 4. Dispara a lógica de aplicação (integração com seu código de máscara)
            aplicarMolduraNoBanner(frameSrc);

            // 5. Scroll suave para centralizar o item clicado (UX)
            item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        });
    });
});

// Função de exemplo para integrar com o que fizemos anteriormente
function aplicarMolduraNoBanner(src) {
    const frameLayer = document.getElementById('frame-overlay');
    const maskImageSource = document.getElementById('mask-image-source');

    const colorContainer = document.getElementById('color-picker-container');

    

    // 1. Atualiza a imagem dentro da definição da máscara SVG
    // Isso transforma o PNG em uma máscara vetorial para o CSS
    maskImageSource.setAttribute('href', src);
    
    // 2. Garante que a camada de cor esteja visível
    frameLayer.style.display = 'block';
    
    // 3. Mostra o container de cores

    if (src === 'none') {
        if(frameLayer) frameLayer.style.display = 'none';
        if(colorContainer) colorContainer.style.display = 'none';
    } else {
        if(frameLayer) {
            frameLayer.style.display = 'block';
            if(maskImageSource) {
                maskImageSource.setAttributeNS('http://www.w3.org/1999/xlink', 'href', src);
            }
        }
        // Mostra o slider apenas quando uma moldura é selecionada
        if(colorContainer) colorContainer.style.display = 'block';
    }
}
// Atualize o evento de clique nos itens do menu
document.querySelectorAll('.moldura-item').forEach(item => {
    item.addEventListener('click', () => {
        const frameSrc = item.getAttribute('data-src');
        
        // Ativa visualmente o item no menu
        document.querySelectorAll('.moldura-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');

        // Chama a conversão para máscara
        aplicarMolduraNoBanner(frameSrc);
    });
});


    const colorSlider = document.getElementById('color-slider');
    const frameOverlay = document.getElementById('frame-overlay');
    const colorContainer = document.getElementById('color-picker-container');

    // Escuta a mudança no slider
    colorSlider.oninput = function() {
        const hue = this.value;
        
        // Aplicamos a cor usando HSL (Hue, Saturation, Lightness)
        // Saturação em 100% e Brilho em 50% garante cores vivas
        if (frameOverlay) {
            frameOverlay.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
        }
    };



container.addEventListener('touchend', () => state.isDragging = false);

function getDistance(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
}

});
</script>
