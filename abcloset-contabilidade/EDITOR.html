  <style type="text/css">
/* Container principal com o tamanho exato do seu mockup */

/* Estilo dos botões redondos */

} 
:root {
  --btn-size: 15vw; /* O botão cresce baseado na largura da tela */

}

.app-container {
  width: 100%;

}

.banner-wrapper {
  position: relative;

  /* Mantém a proporção 2:1 (ex: 360px largura / 180px altura) */

  background-color: #222;

}

/* Centralização absoluta dos botões */

  position: absolute;

  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  background: rgba(0, 0, 0, 0.2); /* Escurece levemente o fundo para destacar os ícones */
}

.circle-btn {
  width: var(--btn-size);

  max-width: var(--btn-max);
  max-height: var(--btn-max);
  border-radius: 50%;
  border: none;
  background: white;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

.circle-btn:active {
  transform: scale(0.9); /* Efeito de clique no celular */
}

    background-color: #222;
    overflow: hidden; /* Corta o que estiver fora do container */
    touch-action: none; /* Impede o scroll da página ao mexer na imagem */
}

#banner-img {
    position: absolute;
    user-select: none;
    pointer-events: none; /* O container capturará os gestos */
    will-change: transform; /* Otimiza a animação no celular */
}

/* Botões de Ação Inferiores */
.edit-actions {
    position: absolute;
    bottom: 10px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 15px;
    box-sizing: border-box;
}

.action-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    font-size: 55px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
}

.cancel { background: #e35040; color: white; }
.confirm { background: #58d320; color: white; }
#camera-stream {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Garante que o vídeo preencha o banner sem sobras */
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    background: #000;
}
input[type=range] {
    width: 100%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    outline: none;
    appearance: none; /* Remove estilo padrão */
}

/* O "círculo" de arrastar fica maior para o dedo */
input[type=range]::-webkit-slider-thumb {
    appearance: none;
    width: 25px;
    height: 25px;
    background: #4f46e5;
    border-radius: 50%;
    cursor: pointer;
}

    position: relative;
    width: 100%;
    height: 300px;
    background-color: #000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none; /* Bloqueia scroll da página ao manipular imagem */
}

/* Ajuste para permitir manipulação total sem corte inicial */
.preview-img {
    position: absolute;
    max-width: none; /* Permite que a imagem seja maior que o container */
    min-width: 100%;
    min-height: 100%;
    transition: opacity 0.3s;
    cursor: move;
}

/* Botão de Captura (Círculo branco semitransparente) */
.camera-shutter {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.5);
    border: 4px solid #fff;
    border-radius: 50%;
    z-index: 20;
    cursor: pointer;
}

/* Botão de Fechar Câmera (X no topo direito) */
.camera-x {
    position: absolute;
    top: 20px;
    right: 30px;
    background: rgba(0, 0, 0, 0.0);
    color: #fff;
    border: none;
    font-size: 50px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    z-index: 20;
    cursor: pointer;
}

    position: absolute;
    bottom: 10px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 15;
}
/* Ajuste para permitir manipulação total sem corte inicial */
#preview-img {
    position: absolute;
    max-width: none; /* Permite que a imagem seja maior que o container */
    min-width: 100%;

    transition: opacity 0.3s;
    cursor: move;
}
/* Container do banner */
.banner-editor {
    position: relative;
    width: 100%;
    height: 500px;
    background-color: #000;
    overflow: hidden; /* Mantém o corte visual apenas nas bordas do banner */
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

#preview-img {
    position: absolute;
    /* Remover estas linhas se existirem: width: 100%; height: 100%; object-fit: cover; */
    
    /* Forçar a imagem a ignorar o tamanho do container pai */
    width: auto !important;
    height: auto !important;
    max-width: none !important;
    max-height: none !important;

    /* Garantir que ela comece cobrindo pelo menos a área visível */
    min-width: 100%;
    min-height: 100%;

    cursor: move;
    transform-origin: center; /* O zoom acontecerá a partir do centro */
    transition: opacity 0.3s; /* Não coloque transition no transform, ou o toque ficará lento */
}
  </style>
  <canvas id="capture-canvas" style="display: none;"></canvas>
<div id="banner-fachada-container" class="banner-editor" style="max-width: none ">
    <img id ="preview-img" src="banner.jpg" alt="Fachada" style=" transform: translate(0,0) scale(1);">

    <video id="camera-stream" autoplay playsinline style="display: none;"></video>

    <div id="initial-controls" class="capture-actions">
        <button id="btn-camera">📷</button>
        <button id="btn-gallery">🗂️</button>
    </div>

    <div id="edit-controls" class="edit-actions" style="display: none;">
        <button id="btn-cancel-edit" class="action-btn cancel">❌</button>
        <button id="btn-confirm-edit" class="action-btn confirm">✔️</button>
    </div>

    <div id="camera-controls" style="display: none;">
        <button id="btn-close-camera" class="camera-x">✕</button>
        <button id="btn-capture" class="camera-shutter"></button>
    </div>

    <input type="file" id="input-file" accept="image/*" hidden>
</div>
<script type="text/javascript">

document.addEventListener("DOMContentLoaded", () => {
    const img = document.getElementById('preview-img');
    const video = document.getElementById('camera-stream');
    const initialControls = document.getElementById('initial-controls');
    const editControls = document.getElementById('edit-controls');
    const cameraControls = document.getElementById('camera-controls');
    const inputFile = document.getElementById('input-file');
    const container = document.getElementById('banner-fachada-container');
    let stream = null;
    const defaultImage = "banner.jpg"; // Caminho da sua imagem padrão

    // --- RESET E INTERFACE ---
    function showInitialUI() {
        initialControls.style.display = 'flex';
        editControls.style.display = 'none';
        cameraControls.style.display = 'none';
        video.style.display = 'none';
        
        // Reset de estilo e posição
        //img.style.transform = `translate(0,0) scale(1)`;
        img.style.opacity = "1";
    }

    // --- LOGICA DE GALERIA ---
    document.getElementById('btn-gallery').onclick = () => inputFile.click();

    // 1. CORREÇÃO DA GALERIA (No evento onchange do input-file)
    inputFile.onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            img.src = event.target.result;
            
            // O segredo está aqui: esperar carregar e resetar o Transformer
            img.onload = () => {
                resetImageToFreeMode();
                initialControls.style.display = 'none';
                editControls.style.display = 'flex';
                img.style.opacity = "0.8"; 
            };
        };
        reader.readAsDataURL(file);
    }
};

    // --- LOGICA DE CÂMERA ---
    document.getElementById('btn-camera').onclick = async () => {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.style.display = 'block';
            initialControls.style.display = 'none';
            cameraControls.style.display = 'block';
        } catch (err) {
            alert("Erro ao acessar câmera.");
        }
    };

    // 2. CORREÇÃO DA CÂMERA (No evento de captura)
    // Quando capturar da Câmera
    document.getElementById('btn-capture').onclick = () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        img.src = canvas.toDataURL('image/jpeg');
        
        img.onload = () => {
            stopCamera();
            resetImageToFreeMode(); // Aplica o modo livre na foto da câmera
            cameraControls.style.display = 'none';
            editControls.style.display = 'flex';
        };
    };

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }
        video.style.display = 'none';
    }

    document.getElementById('btn-close-camera').onclick = () => {
        stopCamera();
        showInitialUI();
    };

    // --- CANCELAR E CONFIRMAR ---
    // 3. CORREÇÃO DO BOTÃO CANCELAR (Reset total para a imagem padrão)
    document.getElementById('btn-cancel-edit').onclick = () => {
        img.src = "banner.jpg"; // Volta para a imagem padrão do projeto
        img.onload = () => {
            resetImageToFreeMode(); // Limpa qualquer zoom/movimento que foi feito
            showInitialUI();
        };
    };

    document.getElementById('btn-confirm-edit').onclick = () => {
        alert("Fachada definida!");
        showInitialUI();
        // Aqui a imagem permanece a editada, mas os botões voltam ao início
    };

    // [O código de movimentação/zoom com TouchEvents deve ser mantido aqui]
    function updateTransform() {
    img.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
}
// Função para resetar posição e escala (importante para não começar cortada)
// Esta função será o seu "Setador de Atributos" toda vez que a imagem mudar
function resetImageToFreeMode() {
    state.x = 0;
    state.y = 0;
    state.scale = 1;
    
    // Removemos qualquer trava de largura/altura que possa ter sido injetada
    img.style.width = 'auto';
    img.style.height = 'auto';
    
    updateTransform();
}





    let state = {
    x: 0, y: 0, scale: 1,
    isDragging: false,
    lastX: 0, lastY: 0,
    lastDist: 0 // Para o pinch-zoom (dois dedos)
};
// --- LÓGICA DE MANIPULAÇÃO ---
container.addEventListener('touchstart', (e) => {
    if (editControls.style.display === 'none') return;
    
    state.isDragging = true;
    if (e.touches.length === 1) {
        state.lastX = e.touches[0].clientX - state.x;
        state.lastY = e.touches[0].clientY - state.y;
    } else if (e.touches.length === 2) {
        state.lastDist = getDistance(e.touches);
    }
});

container.addEventListener('touchmove', (e) => {
    if (!state.isDragging) return;

    if (e.touches.length === 1) {
        state.x = e.touches[0].clientX - state.lastX;
        state.y = e.touches[0].clientY - state.lastY;
    } else if (e.touches.length === 2) {
        const dist = getDistance(e.touches);
        const delta = dist / state.lastDist;
        state.scale *= delta;
        state.lastDist = dist;
    }
    updateTransform();
});

container.addEventListener('touchend', () => state.isDragging = false);

function getDistance(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
}

});
</script>
</body>
</html>
