<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Chatbot</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#chat-container{
width:350px;
height:500px;
background:white;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
overflow:hidden;
}

#chat-log{
flex:1;
padding:15px;
overflow-y:auto;
}

.msg{
margin:8px 0;
padding:8px 12px;
border-radius:10px;
max-width:75%;
}

.user{
background:#007bff;
color:white;
align-self:flex-end;
}

.bot{
background:#e9ecef;
}

#chat-input{
display:flex;
border-top:1px solid #ccc;
}

#input{
flex:1;
padding:10px;
border:none;
outline:none;
}

button{
padding:10px 15px;
border:none;
background:#007bff;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div id="chat-container">

<div id="chat-log"></div>

<div id="chat-input">
<input id="input" placeholder="Digite sua mensagem...">
<button onclick="enviar()">Enviar</button>
</div>

</div>

<script>

let dadosTreinamento;
let memoria = [];

async function carregarTreinamento(){

const res = await fetch("./treinamentoChat.json?nocache="+Date.now());
dadosTreinamento = await res.json();

}

function exibirMensagem(autor,msg){

const log=document.getElementById("chat-log");

const div=document.createElement("div");

div.className="msg "+autor;
div.innerText=msg;

log.appendChild(div);

log.scrollTop=log.scrollHeight;

}

function encontrarIntent(fraseUsuario){

fraseUsuario=fraseUsuario.toLowerCase();

let melhorIntent=null;
let melhorScore=0;

dadosTreinamento.documentos.forEach(doc=>{

let fraseTreino=doc.frase.toLowerCase();

let palavrasUser=fraseUsuario.split(" ");
let palavrasTreino=fraseTreino.split(" ");

let score=0;

palavrasUser.forEach(p=>{

if(palavrasTreino.includes(p)) score++;

});

if(score>melhorScore){

melhorScore=score;
melhorIntent=doc.intent;

}

});

return melhorIntent;

}

function responder(frase){

const intent=encontrarIntent(frase);

if(!intent){

return "Desculpe, não entendi sua pergunta.";

}

const resp=dadosTreinamento.respostas.find(r=>r.intent===intent);

if(resp) return resp.resposta;

return "Ainda não tenho resposta para isso.";

}

function enviar(){

const input=document.getElementById("input");

let texto=input.value.trim();

if(!texto) return;

exibirMensagem("user",texto);

memoria.push(texto);

input.value="";

exibirMensagem("bot","digitando...");

setTimeout(()=>{

const log=document.getElementById("chat-log");
log.lastChild.remove();

let resposta=responder(texto);

exibirMensagem("bot",resposta);

memoria.push(resposta);

},600);

}

carregarTreinamento();

</script>

</body>
</html>
